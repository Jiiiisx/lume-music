[workspace]
resolver = "2"
members = [
    "crates/lume-core",
    "crates/lume-storage",
    "crates/lume-providers",
    "crates/lume-audio",
    "crates/lume-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Lume Music"]

[workspace.dependencies]
async-trait = "0.1"
base64 = "0.22"
bytemuck = { version = "1", features = ["derive"] }
dirs = "7.0"
iced = { version = "0.14", features = ["wgpu", "tokio", "image", "svg", "advanced"] }
image = "0.25"
librespot-core = "0.8"
librespot-playback = "0.8"
lofty = "0.25"
rand = "0.10"
raw-window-handle = "0.6"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "query", "charset", "http2", "system-proxy"] }
rfd = "0.18"
rodio = { version = "0.23", features = ["symphonia-all"] }
rusqlite = { version = "0.43", features = ["bundled"] }
rustypipe = { version = "0.11", default-features = false, features = ["native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
souvlaki = "0.9"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process"] }
toml = "1.2"
url = "2.5"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
window-vibrancy = "0.8"

lume-core = { path = "crates/lume-core" }
lume-storage = { path = "crates/lume-storage" }
lume-providers = { path = "crates/lume-providers" }
lume-audio = { path = "crates/lume-audio" }

[patch.crates-io]
iced_wgpu = { path = "patches/iced_wgpu" }
iced_winit = { path = "patches/iced_winit" }
